<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        root {
            --scroll: '0'
        }
        .spinscroll {
            position: fixed;
            top: 50%;
            left: 50%;
            margin-top: -50px;
            margin-left: -50px;
            animation: rotate 1s linear 1;
            animation-play-state: paused;
            animation-delay: calc(var(--scroll) * -1s);
        }
        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        body {
            min-height: 300vh;
        }
    </style>
</head>
<body>
<svg width="100" height="100" viewBox="0 0 24 24" class="spinscroll">
    <path d="M21,9H15V22H13V16H11V22H9V9H3V7H21M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6C10.89,6 10,5.1 10,4C10,2.89 10.89,2 12,2Z"/>
</svg>
<script>
    window.addEventListener("scroll", () => {
        let offSet = window.scrollY;
        let offSetHeight = document.body.offsetHeight;
        let innerHeight = window.innerHeight;
        let property = offSet / (offSetHeight - innerHeight)
        document.body.style.setProperty("--scroll", String(property));
    });
</script>
</body>
</html>
