<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<style>
    :root {
        --color: #87e187;
    }
    .container {
        width: 300px;
        margin: 0 auto;
        height: 90vh;
        display: grid;
        place-items: center;
    }
    svg {
        border: 1px dotted black;
    }
    .line {
        stroke: var(--color);
        stroke-width: 24;
        stroke-linecap: round;
        fill: none;
        transition: .4s;
    }

    .eyes {
        fill: var(--color);
        transition: .4s;
    }

    .hover:hover {
        --color: #ef7979;
        & path {
            d: path("M 50, 150 Q 100,140 150, 150");
        }
    }
</style>
<body>
<div class="container">
    <svg class="hover" width="100" height="100" viewbox="0 0 200 200">
        <circle
                class="eyes"
                r="20"
                cx="30%"
                cy="40%"
        />
        <circle
                class="eyes"
                r="20"
                cx="70%"
                cy="40%"
        />
        <path
                class="line"
                d="M 50, 150 Q 100,170 150, 150"
        />
    </svg>
</div>
</body>
</html>
